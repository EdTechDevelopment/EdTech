spring:
  application:
    name: edtech-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/edtech
    username: edtech
    password: edtech

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jackson:
    deserialization:
      fail-on-unknown-properties: true

identity:
  notification:
    frontend-base-url: http://frontend.example:3000
    email-verification-path: /verify-email
  security:
    password:
      bcrypt-strength: 10
  token:
    verification-ttl: 5m
    verification-entropy-bytes: 32

notifications:
  delivery:
    batch-size: 10
    processing-timeout: 1m
    poll-delay: 10s
    initial-delay: 10s
    scheduler-enabled: true
  mail:
    from-address: no-reply@edtech.local
