  <script>
    const MODEL = {"packages": [{"name": "api", "fullName": "api", "href": "readable/package_api.html", "originalHref": "content/Package_rBiXMQWGAqAAZxH_.html", "description": "Публичный Java API модуля Identity для взаимодействия с другими backend-модулями.\n\nПредоставляет безопасные сведения о пользователях: идентификатор, имя, фамилию, email, роли и статус аккаунта.\n\nTutoring и Scheduling обращаются к Identity только через этот пакет. Внутренние доменные сущности, пароль, сессии и проверочные токены через API не раскрываются.", "elements": [], "children": [{"name": "event", "fullName": "api.event", "href": "readable/package_api_event.html", "originalHref": "content/Package_YVzG8QWGAqAAZgg9.html", "description": "Публичное событие регистрации пользователя.\n\nПубликуется после успешного сохранения нового аккаунта.\n\nTutoring обрабатывает событие, чтобы найти ожидающее приглашение по email и связать его с зарегистрированным userId. Приглашение остаётся в статусе PENDING до явного принятия учеником.", "elements": [{"name": "UserAccountUpdatedEvent", "kind": "Класс", "href": "content/Class_MI328QWGAqAAZgqo.html", "description": "Публичное событие изменения общих данных аккаунта.\n\nПубликуется после изменения имени, фамилии или подтверждённой смены email.\n\nМожет использоваться другими модулями для обновления локальной read model."}, {"name": "UserActivatedEvent", "kind": "Класс", "href": "content/Class_gYX28QWGAqAAZgqg.html", "description": "Публичное событие активации аккаунта.\n\nПубликуется после успешного подтверждения email и перехода пользователя в состояние ACTIVE."}, {"name": "UserRegisteredEvent", "kind": "Класс", "href": "content/Class_dMEW8QWGAqAAZgnv.html", "description": "Публичное событие регистрации пользователя.\n\nПубликуется после успешного сохранения нового аккаунта.\n\nTutoring обрабатывает событие, чтобы найти ожидающее приглашение по email и связать его с зарегистрированным userId. Приглашение остаётся в статусе PENDING до явного принятия учеником."}], "children": []}, {"name": "model", "fullName": "api.model", "href": "readable/package_api_model.html", "originalHref": "content/Package_3q7G8QWGAqAAZghS.html", "description": "Безопасное неизменяемое представление пользователя для межмодульного взаимодействия.\n\nСодержит идентификатор, подтверждённый email, имя, фамилию, роли и состояние аккаунта.\n\nНе содержит passwordHash, pendingEmail, JWT, refresh-токены, проверочные токены и persistence records.", "elements": [{"name": "UserRoleView", "kind": "Класс", "href": "content/Class_MtoR8QWGAqAAZgve.html", "description": "Публичное представление ролей пользователя.\n\nОтделено от внутреннего доменного перечисления identity.domain.model.UserRole.\n\nОдин пользователь может одновременно иметь роли TEACHER и STUDENT."}, {"name": "UserStatusView", "kind": "Класс", "href": "content/Class_D5YR8QWGAqAAZgvm.html", "description": "Публичное представление состояния аккаунта.\n\nPENDING_EMAIL_VERIFICATION означает, что пользователь зарегистрирован, но ещё не подтвердил email.\n\nACTIVE означает, что пользователь подтвердил email и может проходить аутентификацию.\n\nBLOCKED означает, что доступ пользователя заблокирован."}, {"name": "UserSummary", "kind": "Класс", "href": "content/Class_yxIR8QWGAqAAZgvY.html", "description": "Безопасное неизменяемое представление пользователя для межмодульного взаимодействия.\n\nСодержит идентификатор, подтверждённый email, имя, фамилию, роли и состояние аккаунта.\n\nНе содержит passwordHash, pendingEmail, JWT, refresh-токены, проверочные токены и persistence records."}], "children": []}, {"name": "query", "fullName": "api.query", "href": "readable/package_api_query.html", "originalHref": "content/Package_3lbIsQWGAqAAZxOE.html", "description": "Публичный синхронный интерфейс чтения данных пользователей.\n\nИспользуется модулями Tutoring и Scheduling для получения безопасного представления пользователя и проверки его ролей.\n\nИнтерфейс не изменяет состояние Identity и не возвращает внутренние доменные сущности.", "elements": [{"name": "IdentityQuery", "kind": "Класс", "href": "content/Class_gh8x8QWGAqAAZgzV.html", "description": "Публичный синхронный интерфейс чтения данных пользователей.\n\nИспользуется модулями Tutoring и Scheduling для получения безопасного представления пользователя и проверки его ролей.\n\nИнтерфейс не изменяет состояние Identity и не возвращает внутренние доменные сущности."}], "children": []}]}, {"name": "application", "fullName": "application", "href": "readable/package_application.html", "originalHref": "content/Package_tNuXMQWGAqAAZxIa.html", "description": "Прикладной слой, реализующий конкретные пользовательские сценарии Identity.\n\nОркестрирует выполнение операций, задаёт транзакционные границы, вызывает доменную модель и обращается к внешним технологиям через output-порты.\n\nApplication определяет последовательность действий, но не содержит реализации PostgreSQL, jOOQ, BCrypt, SMTP или Spring Session.", "elements": [], "children": [{"name": "command", "fullName": "application.command", "href": "readable/package_application_command.html", "originalHref": "content/Package_gwIpiQWGAqAAZiSe.html", "description": "Содержит неизменяемые входные модели операций, изменяющих состояние системы.\n\nCommand передаёт данные конкретного сценария и не содержит бизнес-логики, HTTP-аннотаций или persistence-моделей.", "elements": [], "children": [{"name": "account", "fullName": "application.command.account", "href": "readable/package_application_command_account.html", "originalHref": "content/Package_5mTjiQWGAqAAZicF.html", "description": "Содержит команды регистрации пользователя и изменения данных текущего аккаунта", "elements": [{"name": "RegisterUserCommand", "kind": "Класс", "href": "content/Class_E6EHiQWGAqAAZips.html", "description": "Неизменяемая входная модель регистрации пользователя.\n\nСодержит открытый пароль только на время выполнения сценария. Открытый пароль нельзя сохранять, возвращать в ответе или записывать в журнал."}, {"name": "UpdateCurrentUserCommand", "kind": "Класс", "href": "content/Class_PfxHiQWGAqAAZirU.html", "description": "Неизменяемая входная модель частичного изменения текущего пользователя.\n\nuserId определяется по аутентифицированному principal и не принимается от клиента. Команда должна содержать минимум одно изменяемое поле.\n\nВ Java может быть реализована как record."}], "children": []}, {"name": "authenticaion", "fullName": "application.command.authenticaion", "href": "readable/package_application_command_authenticaion.html", "originalHref": "content/Package_sIzjiQWGAqAAZicd.html", "description": "Содержит команды входа, обновления токенов и выхода.", "elements": [{"name": "LoginCommand", "kind": "Класс", "href": "content/Class_Qq5niQWGAqAAZiwi.html", "description": "Неизменяемая входная модель аутентификации пользователя.\n\nСодержит email и открытый пароль. Открытый пароль используется только для проверки через PasswordHasher и нигде не сохраняется."}, {"name": "LogoutCommand", "kind": "Класс", "href": "content/Class_skbniQWGAqAAZixc.html", "description": "Неизменяемая входная модель выхода пользователя.\n\nСодержит открытое значение refresh token, который application должен найти по hash и отозвать."}, {"name": "RefreshTokenCommand", "kind": "Класс", "href": "content/Class_kbrniQWGAqAAZixQ.html", "description": "Неизменяемая входная модель обновления токенов.\n\nСодержит открытое значение refresh token, полученное presentation из HttpOnly cookie.\n\nApplication вычисляет hash токена и не сохраняет его открытое значение."}], "children": []}, {"name": "verification", "fullName": "application.command.verification", "href": "readable/package_application_command_verification.html", "originalHref": "content/Package_s5TjiQWGAqAAZicR.html", "description": "Содержит команды подтверждения email и повторной отправки проверочного письма.", "elements": [{"name": "ConfirmEmailCommand", "kind": "Класс", "href": "content/Class_4IMniQWGAqAAZiub.html", "description": "Неизменяемая входная модель подтверждения email.\n\nСодержит открытое значение одноразового проверочного токена. Application вычисляет его hash и выполняет поиск EmailVerification по полученному hash.\n\nОткрытое значение токена не сохраняется."}, {"name": "ResendEmailVerificationCommand", "kind": "Класс", "href": "content/Class_QqqniQWGAqAAZivD.html", "description": "Неизменяемая входная модель запроса повторного письма подтверждения.\n\nОтвет сценария не должен позволять определить, зарегистрирован ли переданный email.\n\nВ Java может быть реализована как record."}], "children": []}]}, {"name": "exception", "fullName": "application.exception", "href": "readable/package_application_exception.html", "originalHref": "content/Package_C5opiQWGAqAAZiSt.html", "description": "Содержит ошибки прикладных сценариев Identity.\n\nЭти исключения образуют стабильную границу между application и presentation. Application преобразует внутренние доменные ошибки в ошибки, понятные вызывающему слою.", "elements": [{"name": "AccountOperationNotAllowedException", "kind": "Класс", "href": "content/Class__XCISQWGAqAAZjaX.html", "description": "Запрошенная операция запрещена текущим состоянием аккаунта.\n\nИспользуется как application-представление нарушения доменного состояния, которое presentation может преобразовать в единый HTTP-ответ."}, {"name": "EmailAlreadyExistsException", "kind": "Класс", "href": "content/Class_NhiISQWGAqAAZja7.html", "description": "Переданный email уже используется как основной или ожидающий подтверждения адрес другого пользователя.\n\nВозникает при регистрации или запросе изменения email."}, {"name": "EmailVerificationRequiredException", "kind": "Класс", "href": "content/Class_tRsISQWGAqAAZjaJ.html", "description": "Аутентификация пользователя запрещена, потому что основной email ещё не подтверждён.\n\nPresentation преобразует исключение в стабильный код ошибки, понятный frontend."}, {"name": "InvalidCredentialsException", "kind": "Класс", "href": "content/Class_N8SISQWGAqAAZjbh.html", "description": "Переданные учётные данные не прошли проверку.\n\nОдинаковое исключение используется для неизвестного email и неверного пароля, чтобы не раскрывать существование аккаунта."}, {"name": "InvalidRefreshTokenException", "kind": "Класс", "href": "content/Class_M4iISQWGAqAAZjaj.html", "description": "Refresh token неизвестен, просрочен, отозван или был повторно использован.\n\nПри обнаружении повторного использования application может дополнительно отозвать всю связанную token family."}, {"name": "InvalidUseCaseInputException", "kind": "Класс", "href": "content/Class_4XiISQWGAqAAZjbT.html", "description": "Application-команда или query содержат некорректные или неподдерживаемые данные.\n\nИсключение используется для ошибок прикладной валидации, которые не относятся к формату HTTP-запроса и не являются нарушением состояния конкретного aggregate."}, {"name": "InvalidVerificationTokenException", "kind": "Класс", "href": "content/Class_NqiISQWGAqAAZjav.html", "description": "Проверочный токен неизвестен, просрочен, уже использован или был инвалидирован.\n\nИсключение не раскрывает точную причину недействительности токена."}, {"name": "UserNotFoundException", "kind": "Класс", "href": "content/Class_stiISQWGAqAAZjbH.html", "description": "Пользователь, необходимый для выполнения прикладного сценария, не найден.\n\nPresentation преобразует исключение в соответствующий HTTP-ответ без раскрытия внутренних persistence-данных."}], "children": []}, {"name": "mapper", "fullName": "application.mapper", "href": "readable/package_application_mapper.html", "originalHref": "content/Package_rMApiQWGAqAAZiRm.html", "description": "Содержит преобразования доменных объектов в application-results и публичные модели identity.api.\n\nMapper не обращается к repository, не меняет доменные объекты и не содержит бизнес-правила", "elements": [{"name": "IdentityApiMapper", "kind": "Класс", "href": "content/Class_8NHwSQWGAqAAZjYH.html", "description": "Преобразует внутренние доменные объекты и domain events в публичные модели identity.api.\n\nИспользуется IdentityQueryService и application-сервисами перед публикацией событий.\n\nНе передаёт доменный User и внутренние domain events за границу модуля Identity."}, {"name": "UserResultMapper", "kind": "Класс", "href": "content/Class_h1zwSQWGAqAAZjXm.html", "description": "Преобразует доменный User в безопасный CurrentUserResult.\n\nMapper не изменяет User, не обращается к repository и не содержит бизнес-правила."}], "children": []}, {"name": "model", "fullName": "application.model", "href": "readable/package_application_model.html", "originalHref": "content/Package_cRKDiQWGAqAAZiU2.html", "description": "Содержит внутренние модели application, необходимые для выпуска и хранения токенов.\n\nЭти модели не передаются frontend и другим бизнес-модулям.", "elements": [{"name": "IssuedAccessToken", "kind": "Класс", "href": "content/Class_xuaPiQWGAqAAZi7B.html", "description": "Внутренняя модель access JWT, созданного через AccessTokenIssuer.\n\nСодержит готовое значение токена и момент окончания его срока действия."}, {"name": "IssuedRefreshToken", "kind": "Класс", "href": "content/Class_V4EviQWGAqAAZi78.html", "description": "Внутренняя модель только что выпущенного refresh token.\n\nОткрытое значение передаётся presentation для установки HttpOnly cookie. Hash и служебные идентификаторы используются для создания RefreshTokenState и сохранения через RefreshTokenRepository."}, {"name": "RefreshTokenState", "kind": "Класс", "href": "content/Class_rsqviQWGAqAAZi8m.html", "description": "Внутренняя модель сохранённого состояния refresh token.\n\nИспользуется для проверки срока действия, отзыва, ротации и обнаружения повторного использования токена.\n\nОткрытое значение refresh token в этой модели не хранится."}], "children": []}, {"name": "port", "fullName": "application.port", "href": "readable/package_application_port.html", "originalHref": "content/Package_rVwpiQWGAqAAZiSO.html", "description": "Содержит входные и выходные границы application.", "elements": [], "children": [{"name": "in", "fullName": "application.port.in", "href": "readable/package_application_port_in.html", "originalHref": "content/Package_gXlDiQWGAqAAZiWO.html", "description": "Содержит интерфейсы пользовательских сценариев Identity.\n\nPresentation зависит от этих интерфейсов и не обращается к application-services напрямую. Каждый интерфейс принимает application command или query и возвращает application result.", "elements": [], "children": [{"name": "account", "fullName": "application.port.in.account", "href": "readable/package_application_port_in_account.html", "originalHref": "content/Package_LDDDiQWGAqAAZiXC.html", "description": "Содержит входные сценарии создания аккаунта, получения текущего пользователя и изменения его данных.", "elements": [{"name": "GetCurrentUserUseCase", "kind": "Класс", "href": "content/Class_iVUbiQWGAqAAZiij.html", "description": "Входной порт получения данных текущего авторизованного пользователя.\n\nИдентификатор пользователя передаётся через GetCurrentUserQuery и должен быть получен presentation из подтверждённого SecurityContext.\n\nВозвращает безопасную application-модель без passwordHash и токенов."}, {"name": "RegisterUserUseCase", "kind": "Класс", "href": "content/Class_jgTriQWGAqAAZihY.html", "description": "Входной порт регистрации нового пользователя.\n\nСоздаёт аккаунт со статусом ожидания подтверждения email, сохраняет одноразовую проверку и инициирует отправку письма.\n\nРегистрация не выдаёт токены аутентификации до подтверждения email. Реализация интерфейса находится в application.service.account."}, {"name": "UpdateCurrentUserUseCase", "kind": "Класс", "href": "content/Class_1rabiQWGAqAAZijd.html", "description": "Входной порт частичного изменения текущего пользователя.\n\nПозволяет изменить имя, фамилию или запросить изменение email. Новый email становится pendingEmail и требует отдельного подтверждения.\n\nРоли, пароль и статус аккаунта через этот сценарий не изменяются."}], "children": []}, {"name": "authentication", "fullName": "application.port.in.authentication", "href": "readable/package_application_port_in_authentication.html", "originalHref": "content/Package_P5LDiQWGAqAAZiXg.html", "description": "Содержит входные сценарии аутентификации, обновления токенов и выхода пользователя.", "elements": [{"name": "LoginUseCase", "kind": "Класс", "href": "content/Class_X357iQWGAqAAZinB.html", "description": "Входной порт аутентификации пользователя по email и паролю.\n\nПроверяет учётные данные и возможность пользователя проходить аутентификацию. После успешной проверки выпускает access JWT и refresh token."}, {"name": "LogoutUseCase", "kind": "Класс", "href": "content/Class_Edn7iQWGAqAAZioo.html", "description": "Входной порт выхода пользователя.\n\nОтзывает refresh token, переданный presentation из HttpOnly cookie. Операция является идемпотентной и не раскрывает, существовал ли переданный токен."}, {"name": "RefreshTokenUseCase", "kind": "Класс", "href": "content/Class_KCd7iQWGAqAAZin2.html", "description": "Входной порт обновления токенов аутентификации.\n\nПроверяет полученный refresh token, выполняет его ротацию и возвращает новый access JWT и новый refresh token.\n\nПовторное использование отозванного refresh token приводит к отзыву связанной token family."}], "children": []}, {"name": "verification", "fullName": "application.port.in.verification", "href": "readable/package_application_port_in_verification.html", "originalHref": "content/Package_ELTDiQWGAqAAZiXO.html", "description": "Содержит входные сценарии подтверждения email и повторной отправки проверочного письма.", "elements": [{"name": "ConfirmEmailUseCase", "kind": "Класс", "href": "content/Class_VpU7iQWGAqAAZik7.html", "description": "Входной порт подтверждения email по одноразовому токену.\n\nПодтверждает регистрацию пользователя или изменение email в зависимости от назначения найденного EmailVerification.\n\nПосле успешного подтверждения выпускает access JWT и refresh token и возвращает AuthenticationResult."}, {"name": "ResendEmailVerificationUseCase", "kind": "Класс", "href": "content/Class_t3i7iQWGAqAAZild.html", "description": "Входной порт повторной отправки письма подтверждения email.\n\nПредыдущая активная проверка инвалидируется, после чего создаётся новый одноразовый токен.\n\nРезультат сценария не должен раскрывать, существует ли пользователь с переданным email."}], "children": []}]}, {"name": "out", "fullName": "application.port.out", "href": "readable/package_application_port_out.html", "originalHref": "content/Package_eeVDiQWGAqAAZiWc.html", "description": "Содержит интерфейсы, через которые application обращается к хранилищу данных, security-компонентам, доставке сообщений и системному времени.\n\nРеализации этих интерфейсов располагаются в infrastructure", "elements": [{"name": "TimeProvider", "kind": "Класс", "href": "content/Class_wHlgSQWGAqAAZjOq.html", "description": "Выходной порт получения текущего времени.\n\nИспользуется при создании доменных объектов, проверке сроков действия, выпуске токенов и сохранении времени отзыва.\n\nПозволяет тестировать сценарии без прямой зависимости от системных часов.\n\n."}], "children": [{"name": "messaging", "fullName": "application.port.out.messaging", "href": "readable/package_application_port_out_messaging.html", "originalHref": "content/Package_6RqjiQWGAqAAZiZM.html", "description": "Содержит абстракции отправки проверочных писем и публикации публичных событий Identity.\n\nApplication определяет момент отправки сообщения, а infrastructure выполняет техническую доставку.", "elements": [{"name": "IntegrationEventPublisher", "kind": "Класс", "href": "content/Class_ifMgSQWGAqAAZjL5.html", "description": "Выходной порт публикации публичных событий Identity.\n\nПолучает события из identity.api.event после успешного изменения состояния. Другие бизнес-модули подписываются на эти события, не получая доступ к domain Identity."}, {"name": "VerificationEmailSender", "kind": "Класс", "href": "content/Class_O4ogSQWGAqAAZjLJ.html", "description": "Выходной порт отправки письма подтверждения email.\n\nApplication передаёт адрес получателя, открытый одноразовый токен, назначение проверки и срок действия.\n\nТехническая доставка через notifications или SMTP-adapter реализуется в infrastructure."}], "children": []}, {"name": "persistence", "fullName": "application.port.out.persistence", "href": "readable/package_application_port_out_persistence.html", "originalHref": "content/Package__IqjiQWGAqAAZiY_.html", "description": "Содержит абстракции сохранения и поиска доменных объектов User, EmailVerification и внутреннего состояния refresh token.\n\nИнтерфейсы не содержат jOOQ records, SQL и деталей PostgreSQL.", "elements": [{"name": "EmailVerificationRepository", "kind": "Класс", "href": "content/Class_oc_fiQWGAqAAZjCk.html", "description": "Выходной порт хранения aggregate EmailVerification.\n\nПозволяет найти проверку по hash токена, найти активную проверку пользователя определённого назначения и сохранить изменённое состояние.\n\nИнтерфейс не содержит jOOQ records и SQL."}, {"name": "RefreshTokenRepository", "kind": "Класс", "href": "content/Class_bhLfiQWGAqAAZjEQ.html", "description": "Выходной порт хранения состояния refresh token.\n\nХранит только hash токена и служебное состояние. Поддерживает сохранение, отзыв, ротацию и отзыв всей token family.\n\nКонкретная реализация через PostgreSQL и jOOQ находится в infrastructure."}, {"name": "UserRepository", "kind": "Класс", "href": "content/Class_GMzviQWGAqAAZi_I.html", "description": "Выходной порт хранения aggregate User.\n\nПредоставляет application только доменные объекты и не раскрывает SQL, jOOQ records или структуру таблиц.\n\nПроверка existsByEmailOrPendingEmail учитывает основной и ожидающий подтверждения email."}], "children": []}, {"name": "security", "fullName": "application.port.out.security", "href": "readable/package_application_port_out_security.html", "originalHref": "content/Package_3SqjiQWGAqAAZiZE.html", "description": "Содержит абстракции хеширования паролей, генерации проверочных токенов, выпуска JWT и управления значениями refresh token.\n\nКонкретные алгоритмы и библиотеки выбираются в infrastructure.", "elements": [{"name": "AccessTokenIssuer", "kind": "Класс", "href": "content/Class_X2gASQWGAqAAZjID.html", "description": "Выходной порт выпуска короткоживущего access JWT.\n\nПолучает идентификатор пользователя, его роли и время выпуска. Конкретный алгоритм подписи, набор claims и длительность токена определяются в infrastructure."}, {"name": "PasswordHasher", "kind": "Класс", "href": "content/Class_50D_iQWGAqAAZjGR.html", "description": "Выходной порт безопасного хеширования и проверки паролей.\n\nСкрывает от application конкретный алгоритм и его параметры. Реализация может использовать BCrypt в infrastructure."}, {"name": "RefreshTokenHasher", "kind": "Класс", "href": "content/Class_MHVASQWGAqAAZjJ4.html", "description": "Выходной порт вычисления hash полученного refresh token.\n\nHash используется для поиска RefreshTokenState, поскольку открытое значение refresh token в базе данных не хранится."}, {"name": "RefreshTokenIssuer", "kind": "Класс", "href": "content/Class_I_BASQWGAqAAZjJU.html", "description": "Выходной порт выпуска refresh token.\n\nПри отсутствии familyId создаёт новую token family. При ротации выпускает токен в существующей family.\n\nВозвращает открытое значение, hash, идентификаторы и срок действия токена."}, {"name": "VerificationTokenGenerator", "kind": "Класс", "href": "content/Class_c_b_iQWGAqAAZjHF.html", "description": "Выходной порт генерации криптографически стойкого одноразового токена подтверждения email.\n\nВозвращает открытое значение, которое передаётся получателю письма. Это значение не сохраняется в базе данных."}, {"name": "VerificationTokenHasher", "kind": "Класс", "href": "content/Class_Lx3_iQWGAqAAZjHj.html", "description": ""}], "children": []}]}]}, {"name": "query", "fullName": "application.query", "href": "readable/package_application_query.html", "originalHref": "content/Package_mbwpiQWGAqAAZiSW.html", "description": "Содержит неизменяемые модели запросов, не изменяющих состояние Identity.", "elements": [{"name": "GetCurrentUserQuery", "kind": "Класс", "href": "content/Class_R0CXiQWGAqAAZizi.html", "description": "Неизменяемая модель запроса данных текущего пользователя.\n\nuserId берётся из подтверждённого SecurityContext. Query не изменяет состояние доменных объектов.\n\nВ Java может быть реализована как record."}], "children": []}, {"name": "result", "fullName": "application.result", "href": "readable/package_application_result.html", "originalHref": "content/Package_0aApiQWGAqAAZiRs.html", "description": "Содержит результаты выполнения application-сценариев.\n\nResult не является HTTP response и не является публичной моделью identity.api. Presentation преобразует result в REST response.", "elements": [{"name": "AuthenticationResult", "kind": "Класс", "href": "content/Class_Yy5XiQWGAqAAZi1a.html", "description": "Внутренний результат успешной аутентификации, подтверждения email или обновления токенов.\n\nPresentation переносит access token и срок его действия в TokenResponse. Refresh token помещается в HttpOnly cookie и не включается в HTTP response body.\n\nResult не должен передаваться другим бизнес-модулям."}, {"name": "CurrentUserResult", "kind": "Класс", "href": "content/Class_dA5XiQWGAqAAZi1M.html", "description": "Безопасное application-представление текущего пользователя.\n\nИспользуется как результат получения и изменения аккаунта. Не содержит passwordHash, refresh token, проверочные токены и persistence-модели.\n\nPresentation преобразует его в UserResponse."}, {"name": "RegistrationResult", "kind": "Класс", "href": "content/Class_RwRXiQWGAqAAZi0a.html", "description": "Результат успешной регистрации пользователя.\n\nСообщает, что аккаунт создан и требует подтверждения email. Не содержит открытый пароль, passwordHash или проверочный токен.\n\nPresentation преобразует этот результат в VerificationPendingResponse."}, {"name": "ResendVerificationResult", "kind": "Класс", "href": "content/Class_o5RXiQWGAqAAZi0u.html", "description": "Унифицированный результат запроса повторной отправки письма подтверждения.\n\nРезультат возвращается в одинаковом виде независимо от существования пользователя. Это предотвращает определение зарегистрированных email через публичный endpoint."}], "children": []}, {"name": "service", "fullName": "application.service", "href": "readable/package_application_service.html", "originalHref": "content/Package_pBApiQWGAqAAZiR0.html", "description": "Содержит реализации входных портов и публичного IdentityQuery.\n\nСервисы загружают доменные объекты, вызывают их методы, сохраняют изменения через output ports и преобразуют результат выполнения сценария.", "elements": [], "children": [{"name": "account", "fullName": "application.service.account", "href": "readable/package_application_service_account.html", "originalHref": "content/Package_Y4yTiQWGAqAAZifS.html", "description": "Реализует регистрацию, получение и изменение текущего пользователя, а также публичные запросы Identity для других бизнес-модулей.", "elements": [{"name": "GetCurrentUserService", "kind": "Класс", "href": "content/Class_M94QSQWGAqAAZjQU.html", "description": "Реализация GetCurrentUserUseCase.\n\nЗагружает User по идентификатору текущего авторизованного пользователя и преобразует его в CurrentUserResult через UserResultMapper.\n\nСервис не принимает userId непосредственно от HTTP-клиента."}, {"name": "IdentityQueryService", "kind": "Класс", "href": "content/Class_z9mQSQWGAqAAZjRk.html", "description": "Реализация публичного интерфейса identity.api.query.IdentityQuery.\n\nПредоставляет другим бизнес-модулям безопасное чтение пользователей, пакетное чтение, поиск по email и проверку роли.\n\nПреобразует доменный User в UserSummary и никогда не возвращает domain или persistence-модели за пределы Identity."}, {"name": "RegisterUserService", "kind": "Класс", "href": "content/Class_d7_gSQWGAqAAZjPt.html", "description": "Реализация RegisterUserUseCase.\n\nПроверяет входные данные и уникальность email, хеширует пароль, создаёт aggregate User и EmailVerification, сохраняет их и инициирует отправку проверочного письма.\n\nПосле сохранения публикует UserRegisteredEvent и возвращает RegistrationResult. Сервис определяет порядок операций, а доменные инварианты выполняются объектами domain."}, {"name": "UpdateCurrentUserService", "kind": "Класс", "href": "content/Class_StcQSQWGAqAAZjQ1.html", "description": "Реализация UpdateCurrentUserUseCase.\n\nЗагружает User и вызывает доменные операции изменения имени или запроса изменения email.\n\nПри изменении email проверяет его уникальность, создаёт EmailVerification с назначением EMAIL_CHANGE и инициирует отправку письма. После сохранения публикует UserAccountUpdatedEvent."}], "children": []}, {"name": "authentication", "fullName": "application.service.authentication", "href": "readable/package_application_service_authentication.html", "originalHref": "content/Package_qWSTiQWGAqAAZifA.html", "description": "Реализует вход пользователя, обновление пары токенов и отзыв refresh token при выходе.", "elements": [{"name": "LoginService", "kind": "Класс", "href": "content/Class_NbawSQWGAqAAZjVR.html", "description": "Реализация LoginUseCase.\n\nНаходит User по email, проверяет пароль и вызывает доменную проверку возможности аутентификации.\n\nПосле успешной проверки выпускает access JWT и refresh token, сохраняет RefreshTokenState и возвращает AuthenticationResult."}, {"name": "LogoutService", "kind": "Класс", "href": "content/Class_yoFwSQWGAqAAZjWx.html", "description": "Реализация LogoutUseCase.\n\nВычисляет hash переданного refresh token и отзывает найденное состояние токена.\n\nОперация является идемпотентной: неизвестный или уже отозванный токен не приводит к раскрытию внутреннего состояния."}, {"name": "RefreshTokenService", "kind": "Класс", "href": "content/Class_fBOwSQWGAqAAZjVs.html", "description": "Реализация RefreshTokenUseCase.\n\nВычисляет hash refresh token, загружает его состояние и проверяет срок действия и отсутствие отзыва.\n\nВыпускает новый access JWT и новый refresh token в той же family. Старый токен отзывается и связывается с новым через replacedByTokenId.\n\nРотация старого токена и сохранение нового выполняются в одной транзакции."}], "children": []}, {"name": "verification", "fullName": "application.service.verification", "href": "readable/package_application_service_verification.html", "originalHref": "content/Package_cvCTiQWGAqAAZies.html", "description": "Реализует подтверждение email и повторную выдачу одноразового проверочного токена", "elements": [{"name": "ConfirmEmailService", "kind": "Класс", "href": "content/Class_3y_QSQWGAqAAZjTy.html", "description": "Реализация ConfirmEmailUseCase.\n\nВычисляет hash полученного токена, загружает EmailVerification и проверяет возможность его использования.\n\nДля регистрации активирует User, а для изменения email подтверждает pendingEmail. После сохранения aggregate публикует соответствующее публичное событие, выпускает токены и возвращает AuthenticationResult.\n\nСервис не вызывает LoginService и использует общие output ports аутентификации напрямую."}, {"name": "ResendEmailVerificationService", "kind": "Класс", "href": "content/Class_sPIwSQWGAqAAZjUU.html", "description": "Реализация ResendEmailVerificationUseCase.\n\nНаходит пользователя, инвалидирует предыдущую активную проверку, создаёт новый проверочный токен и инициирует отправку письма.\n\nДля неизвестного email и недоступной операции возвращает тот же внешний результат, чтобы не раскрывать наличие аккаунта."}], "children": []}]}]}, {"name": "domain", "fullName": "domain", "href": "readable/package_domain.html", "originalHref": "content/Package_em_XMQWGAqAAZxIi.html", "description": "Центральная бизнес-модель модуля Identity.\n\nСодержит сущности, value object, перечисления, бизнес-правила, допустимые изменения состояния, доменные события и доменные исключения.\n\nDomain является чистым Java-кодом и не зависит от Spring, HTTP, jOOQ, PostgreSQL, SMTP и Spring Session.", "elements": [], "children": [{"name": "user", "fullName": "domain.user", "href": "readable/package_domain_user.html", "originalHref": "content/Package_kRgWiQWGAqAAZh3H.html", "description": "Определяет границу агрегата User и объединяет связанные с ним доменные объекты, события и исключения. Агрегат отвечает за состояние аккаунта пользователя, подтверждение текущего email, изменение email, обновление имени, назначенные роли и допустимые переходы статуса.\n\nВсе изменения состояния аккаунта выполняются через корень агрегата User. Внешний код не должен изменять отдельные поля или вложенные объекты напрямую.", "elements": [], "children": [{"name": "event", "fullName": "domain.user.event", "href": "readable/package_domain_user_event.html", "originalHref": "content/Package_Q4eWiQWGAqAAZh5H.html", "description": "Фиксирует факт успешного создания агрегата User. В момент возникновения пользователь имеет статус PENDING_EMAIL_VERIFICATION и ещё не может выполнять вход.\n\nСобытие является внутренним для домена. Application-слой может преобразовать его в публичный UserRegisteredEvent и использовать для запуска разрешённых межмодульных сценариев.", "elements": [{"name": "UserAccountUpdatedEvent", "kind": "Класс", "href": "content/Class_ozf2iQWGAqAAZh_2.html", "description": "Фиксирует факт успешного изменения данных аккаунта пользователя. Может возникать после изменения имени, фамилии или завершённой смены подтверждённого email.\n\nСобытие не содержит пароль, passwordHash, pendingEmail или данные токенов. Application-слой получает необходимый безопасный снимок User и преобразует событие в публичный UserAccountUpdatedEvent."}, {"name": "UserActivatedDomainEvent", "kind": "Класс", "href": "content/Class_ADP2iQWGAqAAZh_u.html", "description": "Фиксирует факт активации аккаунта после успешного подтверждения первоначального email. Событие создаётся только после допустимого перехода пользователя из состояния PENDING_EMAIL_VERIFICATION в ACTIVE.\n\nApplication-слой может преобразовать событие в публичный UserActivatedEvent."}, {"name": "UserRegisteredDomainEvent", "kind": "Класс", "href": "content/Class_gKP2iQWGAqAAZh_o.html", "description": "Фиксирует факт успешного создания агрегата User. В момент возникновения пользователь имеет статус PENDING_EMAIL_VERIFICATION и ещё не может выполнять вход.\n\nСобытие является внутренним для домена. Application-слой может преобразовать его в публичный UserRegisteredEvent и использовать для запуска разрешённых межмодульных сценариев."}], "children": []}, {"name": "exception", "fullName": "domain.user.exception", "href": "readable/package_domain_user_exception.html", "originalHref": "content/Package_jleWiQWGAqAAZh5X.html", "description": "Содержит исключения, возникающие при нарушении инвариантов агрегата User и принадлежащих ему объектов-значений.\n\nИсключения описывают доменную причину ошибки, но не содержат HTTP-статусы, API error codes, JSON-модели или сведения о persistence. Преобразование доменной ошибки в application-ошибку и HTTP-ответ выполняется во внешних слоях.", "elements": [{"name": "Class3", "kind": "Класс", "href": "content/Class_6bfuiQWGAqAAZiD6.html", "description": ""}, {"name": "EmailNotVerifiedException", "kind": "Класс", "href": "content/Class_8E_uiQWGAqAAZiEC.html", "description": "Возникает при попытке аутентификации пользователя, первоначальный email которого ещё не подтверждён.\n\nApplication-слой преобразует это исключение в ошибку EMAIL_NOT_VERIFIED. Само исключение не содержит HTTP-статус или API error code."}, {"name": "InvalidEmailexception", "kind": "Класс", "href": "content/Class_wH3uiQWGAqAAZiDs.html", "description": "Возникает при попытке создать объект Email из пустого, некорректного или недопустимого значения.\n\nИсключение не используется для ситуации, когда корректный email уже занят другим пользователем. Проверка уникальности выполняется application-сервисом через UserRepository."}, {"name": "InvalidUserDataException", "kind": "Класс", "href": "content/Class_85fuiQWGAqAAZiDy.html", "description": "Возникает при создании или изменении User с данными, нарушающими основные инварианты агрегата. Например, при отсутствии имени, фамилии или хотя бы одной роли.\n\nИсключение не содержит сведений о HTTP и не выполняет транспортную валидацию request-моделей."}, {"name": "InvalidUserStateException", "kind": "Класс", "href": "content/Class_cwVeiQWGAqAAZiGg.html", "description": "Возникает, когда операция над User недопустима в текущем состоянии аккаунта. Например, при повторной активации уже активного пользователя или подтверждении email, который не совпадает с pendingEmail.\n\nИсключение отражает нарушение правила перехода состояния внутри агрегата."}], "children": []}, {"name": "model", "fullName": "domain.user.model", "href": "readable/package_domain_user_model.html", "originalHref": "content/Package_QU2WiQWGAqAAZh5B.html", "description": "Содержит корень агрегата User, принадлежащие ему объекты-значения и перечисления. User является единственной точкой изменения состояния аккаунта и защищает его бизнес-инварианты.\n\nПакет не выполняет поиск уникального email, проверку открытого пароля, создание JWT, сохранение в базу данных или отправку писем. Эти действия координируются application-слоем через выходные порты.", "elements": [{"name": "Email", "kind": "Класс", "href": "content/Class__E7WiQWGAqAAZh6i.html", "description": "Неизменяемый объект-значение, представляющий нормализованный email пользователя. Проверяет обязательность значения, удаляет внешние пробелы и гарантирует допустимый формат адреса.\n\nСравнение объектов Email выполняется по значению. Объект не проверяет уникальность адреса в системе, поскольку такая проверка требует обращения к repository."}, {"name": "PasswordHash", "kind": "Класс", "href": "content/Class_et7WiQWGAqAAZh6o.html", "description": "Неизменяемый объект-значение, представляющий результат безопасного хэширования пароля. Гарантирует, что внутри агрегата User хранится только непустой хэш, а не открытый пароль.\n\nОбъект не знает конкретный алгоритм хэширования. Создание и проверка хэша выполняются через PasswordHasher, реализация которого находится в infrastructure."}, {"name": "User", "kind": "Класс", "href": "content/Class_ExQ2iQWGAqAAZh7u.html", "description": "Корень агрегата аккаунта пользователя. Хранит идентификатор, текущий и ожидающий подтверждения email, хэш пароля, имя, фамилию, роли, статус и временные метки.\n\nUser является единственной точкой изменения состояния аккаунта. Он проверяет наличие хотя бы одной роли, запрещает недопустимые переходы статуса, управляет двухэтапной сменой email и не позволяет аутентификацию до подтверждения адреса.\n\nКласс не хранит открытый пароль, JWT, refresh token или технические данные persistence. Уникальность email проверяется application-сервисом через UserRepository."}, {"name": "UserRole", "kind": "Класс", "href": "content/Class_3HnWiQWGAqAAZh68.html", "description": "Определяет бизнес-роли пользователя в системе. Один пользователь должен иметь минимум одну роль и может одновременно иметь роли преподавателя и ученика.\n\nРоль не является отдельным пользователем, профилем или механизмом авторизации Spring Security. Профили преподавателя и ученика принадлежат модулю Tutoring."}, {"name": "UserStatus", "kind": "Класс", "href": "content/Class_EA_WiQWGAqAAZh7Q.html", "description": "Определяет текущее состояние аккаунта пользователя. Новый аккаунт ожидает подтверждения email и становится активным только после успешного подтверждения.\n\nДопустимые переходы статуса контролируются агрегатом User. Application и infrastructure не должны изменять статус напрямую."}], "children": []}]}, {"name": "verification", "fullName": "domain.verification", "href": "readable/package_domain_verification.html", "originalHref": "content/Package_rQEWiQWGAqAAZh4O.html", "description": "Определяет агрегат EmailVerification и связанные с ним доменные типы. Агрегат управляет жизненным циклом одноразового подтверждения email: хранит только хэш токена, назначение подтверждения, целевой адрес, срок действия, время использования и время аннулирования.\n\nEmailVerification ссылается на агрегат User только через userId и не получает объектную или ORM-связь с User. Изменение User после проверки токена координируется application-сервисом.", "elements": [{"name": "EmailVerification", "kind": "Класс", "href": "content/Class_OOA_iQWGAqAAZiHn.html", "description": "Корень агрегата подтверждения email. Представляет одно подтверждение первоначального адреса или изменения текущего адреса пользователя.\n\nАгрегат хранит только хэш токена и запрещает повторное использование, использование после истечения срока действия и использование после аннулирования. Срок действия нового подтверждения составляет 24 часа.\n\nEmailVerification не активирует User и не изменяет его email напрямую. После успешного использования подтверждения application-сервис загружает User по userId и вызывает соответствующую доменную операцию."}, {"name": "InvalidVerificationException", "kind": "Класс", "href": "content/Class_tdQ_iQWGAqAAZiH9.html", "description": "Возникает, когда EmailVerification невозможно использовать: срок действия истёк, подтверждение уже использовано или оно было аннулировано.\n\nApplication-слой преобразует такие случаи в единую внешнюю ошибку INVALID_VERIFICATION_TOKEN, чтобы не раскрывать технические подробности проверки токена."}, {"name": "VerificationPurpose", "kind": "Класс", "href": "content/Class_ceQ_iQWGAqAAZiH1.html", "description": "Определяет назначение подтверждения email. Назначение используется application-сервисом для выбора допустимой операции над агрегатом User после успешной проверки токена."}, {"name": "VerificationTokenHash", "kind": "Класс", "href": "content/Class_ENA_iQWGAqAAZiHt.html", "description": "Неизменяемый объект-значение, представляющий хэш одноразового verification token. Открытый токен существует только на границе сценария и никогда не сохраняется внутри доменной модели или базы данных.\n\nОбъект не определяет конкретный алгоритм хэширования. Генерация и хэширование токена выполняются через выходные порты application-слоя."}], "children": []}]}, {"name": "infrastructure", "fullName": "infrastructure", "href": "readable/package_infrastructure.html", "originalHref": "content/Package_QJhXMQWGAqAAZxIv.html", "description": "Технический слой модуля Identity.\n\nРеализует output-порты application и связывает бизнес-код с PostgreSQL, jOOQ, BCrypt, Spring Security,JWT , SMTP и системным временем.\n\nInfrastructure зависит от application и domain, поскольку реализует объявленные ими интерфейсы и преобразует сохранённые данные в доменные объекты.", "elements": [], "children": [{"name": "messaging", "fullName": "infrastructure.messaging", "href": "readable/package_infrastructure_messaging.html", "originalHref": "content/Package_9gHCSQWGAqAAZje6.html", "description": "Содержит адаптер передачи проверочных писем публичному API модуля Notifications.\n\nIdentity определяет получателя, назначение и срок действия проверки. Notifications сохраняет запрос и выполняет техническую SMTP-доставку.", "elements": [], "children": [{"name": "email", "fullName": "infrastructure.messaging.email", "href": "readable/package_infrastructure_messaging_email.html", "originalHref": "content/Package_hVbiSQWGAqAAZjk6.html", "description": "Содержит адаптер передачи проверочных писем публичному API модуля Notifications.\n\nIdentity определяет получателя, назначение и срок действия проверки. Notifications сохраняет запрос и выполняет техническую SMTP-доставку.", "elements": [{"name": "IdentityNotificationProperties", "kind": "Класс", "href": "content/Class_EqCGSQWGAqAAZkBv.html", "description": "Содержит базовый frontend URL страницы подтверждения email.\n\nNotificationVerificationEmailAdapter добавляет к URL безопасно закодированный verification token.\n\nЗначение отличается для local, test и production окружений."}, {"name": "NotificationVerificationEmailAdapter", "kind": "Класс", "href": "content/Class_BXqGSQWGAqAAZkCc.html", "description": "Преобразует запрос Identity в типизированную команду публичного API модуля Notifications.\n\nФормирует confirmationUrl, преобразует VerificationPurpose во внешний VerificationEmailPurpose и вызывает NotificationGateway.enqueue.\n\nАдаптер не использует SMTP, JavaMailSender и внутренние пакеты Notifications."}], "children": []}, {"name": "event", "fullName": "infrastructure.messaging.event", "href": "readable/package_infrastructure_messaging_event.html", "originalHref": "content/Package_qiHiSQWGAqAAZjlG.html", "description": "Содержит реализацию публикации публичных событий Identity через механизм событий Spring.\n\nПубликуются только события из identity.api.event.", "elements": [{"name": "SpringIntegrationEventPublisher", "kind": "Класс", "href": "content/Class_Z1eGSQWGAqAAZkDm.html", "description": "Публикует публичные события Identity через Spring ApplicationEventPublisher.\n\nПолучает только события из identity.api.event. Внутренние domain events перед публикацией преобразуются IdentityApiMapper.\n\nПодписчики других модулей обрабатывают события после успешной фиксации транзакции."}], "children": []}]}, {"name": "persistence", "fullName": "infrastructure.persistence", "href": "readable/package_infrastructure_persistence.html", "originalHref": "content/Package__IbCSQWGAqAAZjeY.html", "description": "Содержит реализацию хранения данных Identity через PostgreSQL и jOOQ.\n\nPersistence преобразует доменные объекты и внутренние application-модели в записи базы данных. jOOQ records не выходят за границы этого пакета.", "elements": [], "children": [{"name": "adapter", "fullName": "infrastructure.persistence.adapter", "href": "readable/package_infrastructure_persistence_adapter.html", "originalHref": "content/Package_ZNUiSQWGAqAAZjgR.html", "description": "Содержит адаптеры, реализующие persistence output ports application.\n\nАдаптер координирует mapper и низкоуровневый jOOQ repository. SQL непосредственно внутри адаптера не размещается.", "elements": [{"name": "JooqEmailVerificationRepositoryAdapter", "kind": "Класс", "href": "content/Class_Qo_qSQWGAqAAZjzg.html", "description": "Реализация application-порта EmailVerificationRepository через jOOQ.\n\nПреобразует доменные параметры в технические значения, вызывает EmailVerificationJooqRepository и восстанавливает aggregate через EmailVerificationPersistenceMapper.\n\nПоиск токена для подтверждения выполняется с блокировкой строки."}, {"name": "JooqRefreshTokenRepositoryAdapter", "kind": "Класс", "href": "content/Class_qu4aSQWGAqAAZj0y.html", "description": "Реализация application-порта RefreshTokenRepository через jOOQ.\n\nИспользует RefreshTokenJooqRepository для SQL-операций и RefreshTokenPersistenceMapper для преобразования записей.\n\nПоиск refresh token выполняется с блокировкой строки, чтобы обеспечить атомарную ротацию."}, {"name": "JooqUserRepositoryAdapter", "kind": "Класс", "href": "content/Class_3rVqSQWGAqAAZjx_.html", "description": "Реализация application-порта UserRepository через jOOQ.\n\nПередаёт SQL-операции UserJooqRepository и использует UserPersistenceMapper для преобразования данных.\n\nПри нарушении уникальности email преобразует техническую ошибку PostgreSQL в EmailAlreadyExistsException."}], "children": []}, {"name": "data", "fullName": "infrastructure.persistence.data", "href": "readable/package_infrastructure_persistence_data.html", "originalHref": "content/Package_Ks0iSQWGAqAAZjgp.html", "description": "Содержит двусторонние преобразования между domain или application-моделями и техническими persistence-моделями.\n\nMapper не выполняет SQL, не вызывает repository и не применяет бизнес-правила.", "elements": [], "children": [{"name": "generated", "fullName": "infrastructure.persistence.data.generated", "href": "readable/package_infrastructure_persistence_data_generated.html", "originalHref": "content/Package_v4BiSQWGAqAAZjhv.html", "description": "Содержит классы таблиц, записей и перечислений, автоматически созданные jOOQ Codegen по актуальной Flyway-схеме.\n\nСгенерированные классы не редактируются вручную и используются только внутри infrastructure.persistence.", "elements": [], "children": []}, {"name": "model", "fullName": "infrastructure.persistence.data.model", "href": "readable/package_infrastructure_persistence_data_model.html", "originalHref": "content/Package_SP_iSQWGAqAAZjhj.html", "description": "Содержит внутренние составные модели, необходимые для передачи результатов jOOQ-запросов между data repository и persistence mapper.\n\nЭти модели не выходят из infrastructure.persistence.", "elements": [{"name": "UserPersistenceData", "kind": "Класс", "href": "content/Class_SQXSSQWGAqAAZjnS.html", "description": "Внутренняя составная модель загруженного пользователя.\n\nОбъединяет основную запись пользователя, его текущий и ожидающий подтверждения email, а также набор ролей.\n\nИспользуется между UserJooqRepository и UserPersistenceMapper. Не передаётся в application, domain, presentation или public API."}], "children": []}, {"name": "repository", "fullName": "infrastructure.persistence.data.repository", "href": "readable/package_infrastructure_persistence_data_repository.html", "originalHref": "content/Package_hKBiSQWGAqAAZjh7.html", "description": "Содержит низкоуровневые компоненты доступа к PostgreSQL через DSLContext.\n\nRepository выполняет SQL и возвращает jOOQ records или persistence data. Он не зависит от domain и не реализует application output ports.", "elements": [{"name": "EmailVerificationJooqRepository", "kind": "Класс", "href": "content/Class_5u_ySQWGAqAAZjrS.html", "description": "Выполняет SQL-операции с проверками email через DSLContext.\n\nПоиск по token hash при подтверждении получает блокировку строки FOR UPDATE. Это предотвращает одновременное использование одноразового токена двумя запросами.\n\nRepository не зависит от EmailVerification и других domain-классов."}, {"name": "RefreshTokenJooqRepository", "kind": "Класс", "href": "content/Class__TiKSQWGAqAAZjs7.html", "description": "Выполняет SQL-операции с состоянием refresh token через DSLContext.\n\nПоиск токена для refresh получает блокировку строки FOR UPDATE. Это предотвращает успешную параллельную ротацию одного refresh token.\n\nМетоды изменения возвращают количество затронутых строк для технической проверки результата."}, {"name": "UserJooqRepository", "kind": "Класс", "href": "content/Class_Q51ySQWGAqAAZjo4.html", "description": "Низкоуровневый компонент SQL-доступа к пользователям, email и ролям через DSLContext.\n\nВозвращает только jOOQ records и UserPersistenceData. Не создаёт доменный User и не зависит от domain.\n\nОперации сохранения пользователя, email и ролей выполняются в транзакции application-сервиса."}], "children": []}]}, {"name": "mapper", "fullName": "infrastructure.persistence.mapper", "href": "readable/package_infrastructure_persistence_mapper.html", "originalHref": "content/Package_IPUiSQWGAqAAZjgd.html", "description": "Преобразует UserPersistenceData в доменный aggregate User и обратно.\n\nВосстанавливает Email, pendingEmail, PasswordHash, UserRole и UserStatus. Не выполняет SQL и не проверяет прикладные правила.\n\nПри сохранении создаёт отдельные записи CURRENT и PENDING для таблицы identity_user_emails.", "elements": [{"name": "EmailVerificationPersistenceMapper", "kind": "Класс", "href": "content/Class_KI3KSQWGAqAAZjvz.html", "description": "Преобразует jOOQ record проверки email в aggregate EmailVerification и обратно.\n\nВосстанавливает VerificationTokenHash, Email и VerificationPurpose. Не определяет срок действия и не изменяет состояние проверки."}, {"name": "RefreshTokenPersistenceMapper", "kind": "Класс", "href": "content/Class_guoqSQWGAqAAZjwv.html", "description": "Преобразует запись refresh token в RefreshTokenState и обратно.\n\nИспользует название toApplication, потому что RefreshTokenState принадлежит application.model и не является доменной сущностью."}, {"name": "UserPersistenceMapper", "kind": "Класс", "href": "content/Class_2jjKSQWGAqAAZjum.html", "description": "Преобразует UserPersistenceData в доменный aggregate User и обратно.\n\nВосстанавливает Email, pendingEmail, PasswordHash, UserRole и UserStatus. Не выполняет SQL и не проверяет прикладные правила.\n\nПри сохранении создаёт отдельные записи CURRENT и PENDING для таблицы identity_user_emails."}], "children": []}]}, {"name": "security", "fullName": "infrastructure.security", "href": "readable/package_infrastructure_security.html", "originalHref": "content/Package_gibCSQWGAqAAZjek.html", "description": "Содержит преобразование проверенного JWT в стандартную модель аутентификации Spring Security.\n\nПакет извлекает userId и роли из claims, но не загружает User из базы данных при каждом HTTP-запросе.", "elements": [], "children": [{"name": "authentication", "fullName": "infrastructure.security.authentication", "href": "readable/package_infrastructure_security_authentication.html", "originalHref": "content/Package_UiliSQWGAqAAZji9.html", "description": "Содержит преобразование проверенного JWT в стандартную модель аутентификации Spring Security.\n\nПакет извлекает userId и роли из claims, но не загружает User из базы данных при каждом HTTP-запросе.", "elements": [{"name": "IdentityJwtAuthenticationConverter", "kind": "Класс", "href": "content/Class_N9U6SQWGAqAAZj8m.html", "description": "Преобразует проверенный Spring Security Jwt в стандартный JwtAuthenticationToken.\n\nИспользует claim sub как идентификатор пользователя и преобразует значения roles в GrantedAuthority.\n\nНе обращается к UserRepository и не загружает пользователя из базы данных при каждом запросе."}], "children": []}, {"name": "configuration", "fullName": "infrastructure.security.configuration", "href": "readable/package_infrastructure_security_configuration.html", "originalHref": "content/Package_h_liSQWGAqAAZjjJ.html", "description": "Содержит конфигурацию Spring Security, JWT encoder, JWT decoder и параметры времени жизни токенов.\n\nКлючевой материал поступает из внешней конфигурации и не хранится в исходном коде.", "elements": [{"name": "IdentityTokenProperties", "kind": "Класс", "href": "content/Class_9ei6SQWGAqAAZj9Y.html", "description": "Содержит конфигурационные параметры JWT, refresh token и verification token.\n\nСвязывается с application.yml через ConfigurationProperties и проверяет корректность значений при запуске.\n\nКлючи подписи загружаются из внешнего источника и не хранятся в репозитории."}, {"name": "JwtConfiguration", "kind": "Класс", "href": "content/Class_c_W6SQWGAqAAZj_H.html", "description": "Создаёт JwtEncoder и JwtDecoder для RS256.\n\nJwtDecoder проверяет подпись, срок действия, issuer и audience. Конфигурация использует ключевой материал из внешнего источника.\n\nКласс не выпускает токены и не содержит бизнес-правила."}, {"name": "SecurityConfiguration", "kind": "Класс", "href": "content/Class_Hmr6SQWGAqAAZkAF.html", "description": "Настраивает stateless Spring Security и проверку Bearer JWT через OAuth2 Resource Server.\n\nОпределяет публичные и защищённые endpoints, подключает IdentityJwtAuthenticationConverter, CORS, AuthenticationEntryPoint и AccessDeniedHandler.\n\nSecurityConfiguration зависит только от стандартных интерфейсов обработчиков Spring Security и не импортирует конкретные классы presentation."}], "children": []}, {"name": "password", "fullName": "infrastructure.security.password", "href": "readable/package_infrastructure_security_password.html", "originalHref": "content/Package_M_liSQWGAqAAZjjh.html", "description": "Содержит техническую реализацию хеширования и проверки паролей.\n\nПакет скрывает конкретный алгоритм и параметры BCrypt от application и domain.", "elements": [{"name": "BCryptPasswordHasher", "kind": "Класс", "href": "content/Class_HXmaSQWGAqAAZj2d.html", "description": "Реализация хеширования и проверки паролей через BCrypt.\n\nИспользует Spring Security PasswordEncoder и скрывает конкретные параметры алгоритма от application.\n\nОткрытый пароль не сохраняется и не записывается в журнал."}], "children": []}, {"name": "token", "fullName": "infrastructure.security.token", "href": "readable/package_infrastructure_security_token.html", "originalHref": "content/Package_x1liSQWGAqAAZjjV.html", "description": "Содержит технические реализации выпуска access JWT, генерации refresh token и генерации одноразовых токенов подтверждения email.\n\nОткрытые refresh и verification tokens не сохраняются в базе данных.", "elements": [{"name": "SecureRefreshTokenIssuer", "kind": "Класс", "href": "content/Class_SAVaSQWGAqAAZj4c.html", "description": "Генерирует криптографически стойкий URL-safe refresh token через SecureRandom.\n\nПри отсутствии familyId создаёт новую token family. При ротации сохраняет существующую familyId.\n\nВозвращает открытое значение, SHA-256 hash, идентификаторы и срок действия токена."}, {"name": "SecureVerificationTokenGenerator", "kind": "Класс", "href": "content/Class_Sw7aSQWGAqAAZj6E.html", "description": "Генерирует криптографически стойкий одноразовый токен подтверждения email.\n\nИспользует SecureRandom и URL-safe Base64 без padding. Открытое значение передаётся только в ссылку подтверждения."}, {"name": "Sha256RefreshTokenHasher", "kind": "Класс", "href": "content/Class_qp9aSQWGAqAAZj5F.html", "description": "Вычисляет SHA-256 hash полученного refresh token.\n\nHash используется для поиска сохранённого RefreshTokenState. Открытое значение токена в PostgreSQL не хранится."}, {"name": "Sha256VerificationTokenHasher", "kind": "Класс", "href": "content/Class_2uvaSQWGAqAAZj6q.html", "description": "Вычисляет SHA-256 hash одноразового токена подтверждения email.\n\nВозвращает доменный value object VerificationTokenHash. Открытое значение токена не сохраняется."}, {"name": "SpringJwtAccessTokenIssuer", "kind": "Класс", "href": "content/Class_cRpaSQWGAqAAZj3x.html", "description": "Выпускает короткоживущий access JWT через Spring Security JwtEncoder.\n\nJWT содержит sub, roles, iss, aud, iat и exp. Email в JWT не включается, потому что он может измениться.\n\nТокен подписывается RS256. Приватный ключ поступает из внешней конфигурации."}], "children": []}]}, {"name": "time", "fullName": "infrastructure.time", "href": "readable/package_infrastructure_time.html", "originalHref": null, "description": "", "elements": [{"name": "SystemTimeProvider", "kind": "Класс", "href": "content/Class_9slGSQWGAqAAZkE1.html", "description": "Предоставляет текущее время через внедрённый java.time.Clock.\n\nВ production используется UTC clock. В тестах можно передать фиксированный Clock.\n\nApplication и domain не обращаются к системным часам напрямую."}], "children": []}]}, {"name": "presentation", "fullName": "presentation", "href": "readable/package_presentation.html", "originalHref": "content/Package_pXGXMQWGAqAAZxIE.html", "description": "Внешний HTTP-интерфейс модуля Identity для frontend.\n\nПринимает HTTP-запросы и JSON, выполняет структурную валидацию входных данных, преобразует request DTO в application-команды, вызывает input-порты и формирует HTTP-ответы.\n\nТакже преобразует исключения application и domain в единый формат ApiError.", "elements": [], "children": [{"name": "account", "fullName": "presentation.account", "href": "readable/package_presentation_account.html", "originalHref": "content/Package_x1QBCQWGAqAAZgqe.html", "description": "Группа HTTP-сценариев работы с общими данными текущего аккаунта.\n\nПакет обслуживает изменение имени, фамилии и email пользователя.\n\nТекущий пользователь определяется по подтверждённому access JWT,\n\nа не по userId, переданному frontend.\n\nИзменение имени и фамилии выполняется сразу. Изменение email запускает\n\nпроцесс подтверждения нового адреса через pendingEmail.\n\nTeacherProfile, StudentProfile, предметы и расписание не принадлежат\n\nэтому пакету.\n\nPATCH /api/v1/me\n\nGET /api/v1/me", "elements": [], "children": [{"name": "controller", "fullName": "presentation.account.controller", "href": "readable/package_presentation_account_controller.html", "originalHref": "content/Package_MWUhCQWGAqAAZguu.html", "description": "Содержит REST-контроллеры операций текущего аккаунта.\n\nКонтроллер получает идентификатор текущего пользователя из контекста\n\nSpring Security, преобразует HTTP-запрос в application-команду\n\nи вызывает входной application-порт.\n\nКонтроллер не должен принимать идентификатор изменяемого пользователя\n\nиз request body или path parameter.", "elements": [{"name": "CurrentUserController", "kind": "Класс", "href": "content/Class_AcXNCQWGAqAAZhA2.html", "description": "HTTP-точка входа для изменения общих данных текущего пользователя.\n\nПолучает userId из claim sub подтверждённого access JWT. Принимает\n\nизменение имени, фамилии или email и передаёт его\n\nUpdateCurrentUserUseCase.\n\nКонтроллер не изменяет User самостоятельно и не решает, можно ли\n\nиспользовать новый email."}], "children": []}, {"name": "mapper", "fullName": "presentation.account.mapper", "href": "readable/package_presentation_account_mapper.html", "originalHref": "content/Package__M0hCQWGAqAAZgu8.html", "description": "Содержит преобразования HTTP-моделей account в модели application и обратно.\n\nMapper добавляет в application-команду userId, полученный контроллером из подтверждённого JWT, и переносит изменяемые данные из request.\n\nПакет не выполняет проверку уникальности email, не загружает User и не применяет к нему изменения.", "elements": [{"name": "UserPresentationMapper", "kind": "Класс", "href": "content/Class_v_6rCQWGAqAAZhFS.html", "description": "Преобразует UpdateCurrentUserRequest и идентификатор текущего пользователя в UpdateCurrentUserCommand.\n\nПреобразует результат application-сценария в UserResponse. Не выполняет бизнес-проверки, не загружает User и не обращается к внешним системам.\n\nКонкретный способ реализации преобразований выбирает разработчик."}], "children": []}, {"name": "model", "fullName": "presentation.account.model", "href": "readable/package_presentation_account_model.html", "originalHref": "content/Package_LzUhCQWGAqAAZgu0.html", "description": "Объединяет HTTP-модели операций текущего аккаунта.\n\nМодели этого пакета описывают обмен данными между frontend и Identity.\n\nОни не являются доменной сущностью User и не должны использоваться\n\nкак persistence-модели.", "elements": [], "children": [{"name": "request", "fullName": "presentation.account.model.request", "href": "readable/package_presentation_account_model_request.html", "originalHref": "content/Package_QBPdCQWGAqAAZhDR.html", "description": "Содержит входные HTTP-модели изменения текущего аккаунта.\n\nRequest содержит только поля, которые пользователь имеет право\n\nизменять через соответствующий endpoint. Идентификатор пользователя,\n\nроли, статус аккаунта и технические поля не принимаются от frontend.\n\nПолный состав полей и правила структурной валидации определяются\n\nOpenAPI-контрактом.", "elements": [{"name": "UpdateCurrentUserRequest", "kind": "Класс", "href": "content/Class__gHLCQWGAqAAZhFE.html", "description": "Входная HTTP-модель частичного изменения текущего пользователя.\n\nЗапрос должен содержать минимум одно изменяемое поле. Изменение email запускает двухэтапный процесс через pendingEmail. Роли, пароль и статус аккаунта через этот запрос не изменяются.\n\nПолный набор доступных полей определяется OpenAPI."}], "children": []}, {"name": "response", "fullName": "presentation.account.model.response", "href": "readable/package_presentation_account_model_response.html", "originalHref": "content/Package_4iPdCQWGAqAAZhDL.html", "description": "Содержит HTTP-представление данных аккаунта пользователя.\n\nResponse-модели предназначены для frontend и содержат только разрешённые\n\nданные. В них отсутствуют пароль, passwordHash, открытые проверочные\n\nтокены, refresh token и внутренние сведения безопасности.", "elements": [{"name": "UserResponse", "kind": "Класс", "href": "content/Class_rnMrCQWGAqAAZhFL.html", "description": "HTTP-представление данных текущего пользователя: идентификатора, email, pendingEmail, имени, фамилии, ролей, статуса аккаунта и временных меток в пределах утверждённого API-контракта.\n\nНе содержит секретные и внутренние данные безопасности."}], "children": []}]}, {"name": "validation", "fullName": "presentation.account.validation", "href": "readable/package_presentation_account_validation.html", "originalHref": "content/Package_uUMhCQWGAqAAZgvM.html", "description": "Содержит проверки структуры HTTP-запросов account, которые нельзя выразить простой проверкой одного поля.\n\nПроверки относятся только к форме входящего запроса. Пакет не проверяет состояние User, уникальность email и другие бизнес-правила.", "elements": [{"name": "AccountUpdateValidator", "kind": "Класс", "href": "content/Class_juw0iQWGAqAAZhZp.html", "description": "Проверяет выполнение структурного правила ValidAccountUpdate для UpdateCurrentUserRequest.\n\nНе проверяет существование пользователя, уникальность email и возможность изменения аккаунта."}, {"name": "ValidAccountUpdate", "kind": "Класс", "href": "content/Class_a_rUiQWGAqAAZhZK.html", "description": "Декларативное правило валидации UpdateCurrentUserRequest. Требует, чтобы запрос содержал минимум одно изменяемое поле."}], "children": []}]}, {"name": "auth", "fullName": "presentation.auth", "href": "readable/package_presentation_auth.html", "originalHref": "content/Package_8PQBCQWGAqAAZgqk.html", "description": "Группа HTTP-сценариев, связанных с регистрацией и аутентификацией\n\nпользователя.\n\nПакет обслуживает регистрацию, подтверждение email, повторную отправку\n\nписьма подтверждения, вход, обновление токенов и выход.\n\nAuth отвечает только за HTTP-представление этих сценариев. Он принимает\n\nучётные данные и токены от клиента, передаёт их application use cases\n\nи формирует соответствующий HTTP-ответ.\n\nПакет не сравнивает пароль с хэшем, не создаёт JWT, не проверяет\n\nподпись JWT, не сохраняет refresh token и не загружает пользователя\n\nиз базы данных.", "elements": [], "children": [{"name": "controller", "fullName": "presentation.auth.controller", "href": "readable/package_presentation_auth_controller.html", "originalHref": "content/Package_Z1ZBCQWGAqAAZgrq.html", "description": "Содержит REST-контроллеры сценариев регистрации и аутентификации.\n\nКонтроллеры определяют URL, HTTP-метод, ожидаемый request и возвращаемый\n\nresponse. Они извлекают данные из JSON, заголовков и cookie, после чего\n\nпередают выполнение входному application-порту.\n\nКонтроллер может выбрать HTTP-статус, установить или удалить cookie\n\nи передать результат mapper-классу.\n\nКонтроллер не должен содержать SQL, транзакции, бизнес-проверки,\n\nкриптографические операции, генерацию токенов или непосредственные\n\nвызовы infrastructure.", "elements": [{"name": "AuthController", "kind": "Класс", "href": "content/Class__hQxCQWGAqAAZg1C.html", "description": "HTTP-точка входа для регистрации, входа, обновления JWT и выхода.\n\nПри регистрации контроллер принимает RegisterRequest и вызывает\n\nRegisterUserUseCase. В ответ возвращает информацию о необходимости\n\nподтверждения email.\n\nПри входе контроллер вызывает LoginUseCase. Access token возвращается\n\nв теле HTTP-ответа, а refresh token устанавливается в HttpOnly cookie.\n\nПри обновлении токенов контроллер получает refresh token из cookie\n\nи передаёт его RefreshTokenUseCase.\n\nПри выходе контроллер передаёт refresh token LogoutUseCase и удаляет\n\nrefresh cookie из браузера."}, {"name": "EmailVerificationController", "kind": "Класс", "href": "content/Class_wyNJCQWGAqAAZg2H.html", "description": "HTTP-точка входа для подтверждения email и повторной отправки\n\nписьма подтверждения.\n\nКонтроллер принимает одноразовый открытый токен, передаёт его\n\nConfirmEmailUseCase и возвращает результат аутентификации после\n\nуспешной активации пользователя.\n\nПри повторной отправке контроллер передаёт email в\n\nResendEmailVerificationUseCase. Ответ не должен раскрывать,\n\nсуществует ли пользователь с указанным email."}], "children": []}, {"name": "cookie", "fullName": "presentation.auth.cookie", "href": "readable/package_presentation_auth_cookie.html", "originalHref": "content/Package_TxlBCQWGAqAAZgsE.html", "description": "Содержит HTTP-логику передачи refresh token через cookie.\n\nПакет получает готовое значение refresh token от application и\n\nсоздаёт безопасную HttpOnly cookie для браузера. При logout пакет\n\nформирует cookie, удаляющую refresh token на стороне клиента.\n\nПакет не создаёт JWT, не проверяет его подпись, не выполняет ротацию,\n\nне отзывает токен и не сохраняет refresh-сессию. Эти операции\n\nвыполняются application и infrastructure.", "elements": [{"name": "RefreshTokenCookieFactory", "kind": "Класс", "href": "content/Class_2XL1CQWGAqAAZg_d.html", "description": "Формирует HTTP cookie для установки или удаления refresh token.\n\nИспользует настройки имени cookie, срока действия, Path, HttpOnly,\n\nSecure и SameSite. Не знает о внутреннем содержимом JWT."}], "children": []}, {"name": "mapper", "fullName": "presentation.auth.mapper", "href": "readable/package_presentation_auth_mapper.html", "originalHref": "content/Package_ql5BCQWGAqAAZgr_.html", "description": "Содержит преобразования между HTTP-моделями auth и моделями application.\n\nMapper преобразует request DTO в application command и application\n\nresult в response DTO. Преобразование должно быть детерминированным\n\nи не иметь внешних побочных эффектов.\n\nMapper не обращается к repository, базе данных, JWT-провайдеру,\n\nSMTP и другим backend-модулям. Он не проверяет бизнес-правила\n\nи не управляет транзакциями.", "elements": [{"name": "AuthPresentationMapper", "kind": "Класс", "href": "content/Class_1te1CQWGAqAAZg_d.html", "description": "Преобразует HTTP-запросы регистрации и авторизации в соответствующие\n\napplication-команды.\n\nПреобразует результаты регистрации и аутентификации в HTTP-ответы.\n\nКонкретный способ реализации, включая ручное преобразование или\n\nMapStruct, выбирает разработчик."}], "children": []}, {"name": "model", "fullName": "presentation.auth.model", "href": "readable/package_presentation_auth_model.html", "originalHref": "content/Package_ww5BCQWGAqAAZgr0.html", "description": "Объединяет HTTP-модели сценариев регистрации и аутентификации.\n\nМодели этого пакета описывают данные, которыми обмениваются frontend\n\nи backend. Они не являются доменными сущностями, application-командами\n\nили структурами хранения данных.\n\nПолный состав полей, обязательность, форматы и ограничения моделей\n\nопределяются OpenAPI-контрактом.", "elements": [], "children": [{"name": "request", "fullName": "presentation.auth.model.request", "href": "readable/package_presentation_auth_model_request.html", "originalHref": "content/Package_t27BCQWGAqAAZgtF.html", "description": "Содержит модели входящих HTTP-запросов регистрации, входа,\n\nподтверждения email и повторной отправки письма.\n\nRequest-модели отражают структуру входящего JSON и содержат только\n\nданные, которые клиент имеет право передавать.\n\nВ request-моделях разрешается указывать аннотации структурной\n\nвалидации: обязательность поля, длину строки и формат email.\n\nПроверка уникальности email, состояния пользователя, правильности\n\nпароля и действительности токена не относится к этому пакету.", "elements": [{"name": "ConfirmEmailRequest", "kind": "Класс", "href": "content/Class_Ub_VCQWGAqAAZg6y.html", "description": "Входная HTTP-модель подтверждения email.\n\nПередаёт одноразовый открытый токен, полученный пользователем в письме.\n\nПроверка назначения, срока действия, хэша и одноразовости токена\n\nвыполняется application-сценарием."}, {"name": "LoginRequest", "kind": "Класс", "href": "content/Class_ERghCQWGAqAAZguC.html", "description": "Входная HTTP-модель аутентификации пользователя по email и паролю.\n\nМодель только передаёт введённые данные. Проверка пароля и состояния\n\nаккаунта выполняется LoginUseCase."}, {"name": "RegisterRequest", "kind": "Класс", "href": "content/Class_u0ghCQWGAqAAZgt2.html", "description": "Входная HTTP-модель регистрации пользователя.\n\nСодержит email, открытый пароль, имя, фамилию и выбранные роли.\n\nОткрытый пароль существует только во время обработки запроса\n\nи никогда не возвращается в ответе и не сохраняется как часть User.\n\nТочный состав и ограничения полей определяются OpenAPI."}, {"name": "ResendEmailVerificationRequest", "kind": "Класс", "href": "content/Class_PmVVCQWGAqAAZg7V.html", "description": "Входная HTTP-модель запроса повторной отправки письма подтверждения.\n\nПередаёт email пользователя. Наличие или отсутствие пользователя\n\nне должно влиять на публичный HTTP-ответ."}], "children": []}, {"name": "response", "fullName": "presentation.auth.model.response", "href": "readable/package_presentation_auth_model_response.html", "originalHref": "content/Package_nbnBCQWGAqAAZgtP.html", "description": "Содержит HTTP-ответы сценариев регистрации, подтверждения email,\n\nвхода и обновления токенов.\n\nResponse-модели содержат только данные, разрешённые для frontend.\n\nОни не должны раскрывать passwordHash, проверочные токены, внутреннее\n\nсостояние refresh-сессии и другие технические данные Identity.\n\nПолный формат JSON определяется OpenAPI-контрактом.", "elements": [{"name": "TokenResponse", "kind": "Класс", "href": "content/Class_qrvVCQWGAqAAZg82.html", "description": "HTTP-ответ успешной аутентификации или обновления токенов.\n\nСодержит access JWT, тип авторизации Bearer и информацию о сроке\n\nдействия access token.\n\nRefresh token в эту модель не входит и передаётся только через\n\nHttpOnly cookie."}, {"name": "VerificationPendingResponse", "kind": "Класс", "href": "content/Class_WxvVCQWGAqAAZg8w.html", "description": "HTTP-ответ успешной регистрации неподтверждённого пользователя.\n\nСообщает frontend, что аккаунт создан и ожидает подтверждения email.\n\nМожет содержать email и время окончания действия отправленного\n\nпроверочного токена."}], "children": []}]}]}, {"name": "error", "fullName": "presentation.error", "href": "readable/package_presentation_error.html", "originalHref": "content/Package_LGQBCQWGAqAAZgqU.html", "description": "Содержит единый HTTP-формат ошибок Identity и преобразование ошибок валидации и application-сценариев в HTTP-ответы.\n\nПакет не содержит бизнес-логику и не изменяет смысл ошибок.", "elements": [], "children": [{"name": "handler", "fullName": "presentation.error.handler", "href": "readable/package_presentation_error_handler.html", "originalHref": "content/Package_iTGhCQWGAqAAZgwL.html", "description": "Содержит обработчики, которые преобразуют исключения HTTP-валидации и application-сценариев Identity в ApiError и соответствующий HTTP-статус.", "elements": [{"name": "IdentityExceptionHandler", "kind": "Класс", "href": "content/Class_CXgbCQWGAqAAZhFg.html", "description": "Преобразует ошибки HTTP-валидации и application-сценариев Identity в единый ApiError.\n\nОбрабатывает неверные учётные данные, неподтверждённый email, конфликт email, неверный проверочный токен, неверный refresh token, отсутствие авторизации и недопустимое состояние аккаунта.\n\nНе содержит бизнес-логику и только отображает уже определённую ошибку в HTTP."}, {"name": "RestAccessDeniedHandler", "kind": "Класс", "href": "content/Class_k5_GSQWGAqAAZkG_.html", "description": "Формирует единый ApiError при недостаточных правах аутентифицированного пользователя.\n\nВозвращает HTTP 403 и ErrorCode.FORBIDDEN. Обработчик не изменяет правила авторизации."}, {"name": "RestAuthenticationEntryPoint", "kind": "Класс", "href": "content/Class_liXGSQWGAqAAZkGT.html", "description": "Формирует единый ApiError для запроса без корректной аутентификации.\n\nВозвращает HTTP 401 и ErrorCode.UNAUTHENTICATED. Обработчик не проверяет JWT самостоятельно и не содержит бизнес-логику."}], "children": []}, {"name": "model", "fullName": "presentation.error.model", "href": "readable/package_presentation_error_model.html", "originalHref": "content/Package_hvGhCQWGAqAAZgwR.html", "description": "Содержит HTTP-модели ошибок, передаваемые frontend. Модели не содержат бизнес-логику и определяют единый формат ошибочного ответа.", "elements": [{"name": "ApiError", "kind": "Класс", "href": "content/Class_ufcbCQWGAqAAZhFu.html", "description": "Единое тело ошибочного HTTP-ответа. Содержит машиночитаемый код, понятное сообщение, список ошибок полей и requestId."}, {"name": "ErrorCode", "kind": "Класс", "href": "content/Class_NgbbCQWGAqAAZhHE.html", "description": "Enumeration со стабильными машиночитаемыми кодами HTTP-ошибок. Frontend использует их для выбора поведения интерфейса. Полный набор значений определяется OpenAPI."}, {"name": "FieldErrorResponse", "kind": "Класс", "href": "content/Class_CIGbCQWGAqAAZhGA.html", "description": "Описывает ошибку конкретного поля входящего HTTP-запроса."}], "children": []}]}]}], "diagrams": [{"name": "account Class Diagram", "kind": "Диаграммы классов", "href": "content/ClassDiagram_jN9riQWGAqAAZigz.html"}, {"name": "account Class Diagram2", "kind": "Диаграммы классов", "href": "content/ClassDiagram_zE4HiQWGAqAAZipW.html"}, {"name": "account Class Diagram3", "kind": "Диаграммы классов", "href": "content/ClassDiagram_NkbgSQWGAqAAZjPX.html"}, {"name": "adapter Class Diagram", "kind": "Диаграммы классов", "href": "content/ClassDiagram_5PlqSQWGAqAAZjxq.html"}, {"name": "auth Class Diagram", "kind": "Диаграммы классов", "href": "content/ClassDiagram_kEhBCQWGAqAAZgrY.html"}, {"name": "authenticaion Class Diagram", "kind": "Диаграммы классов", "href": "content/ClassDiagram_0EZniQWGAqAAZiwO.html"}, {"name": "authentication Class Diagram", "kind": "Диаграммы классов", "href": "content/ClassDiagram_w_J7iQWGAqAAZimt.html"}, {"name": "authentication Class Diagra
